name: autopackline_v1

services:
  mysql:
    image: mysql:8.4
    container_name: autopackline_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-autopackline}
      MYSQL_USER: ${MYSQL_USER:-autopackline}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-autopackline}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_autopackline}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    build: ./backend
    container_name: autopackline_backend
    restart: unless-stopped
    environment:
      APP_NAME: AUTOPACKLINE API
      APP_ENV: development
      API_V1_PREFIX: /api/v1
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-autopackline}:${MYSQL_PASSWORD:-autopackline}@mysql:3306/${MYSQL_DATABASE:-autopackline}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://10.90.100.162:5173,https://localhost:5173,https://127.0.0.1:5173,https://10.90.100.162:5173}
      JWT_SECRET: ${JWT_SECRET:-change-me-development-only}
      JWT_EXP_MINUTES: ${JWT_EXP_MINUTES:-480}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Administrador AUTOPACKLINE}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Autopack@2026}
      PLC_SIMULATOR_TIMEOUT_SECONDS: ${PLC_SIMULATOR_TIMEOUT_SECONDS:-5}
      PLC_RETRY_MAX_ATTEMPTS: ${PLC_RETRY_MAX_ATTEMPTS:-3}
      PLC_RETRY_INTERVAL_SECONDS: ${PLC_RETRY_INTERVAL_SECONDS:-1}
      PLC_PHYSICAL_ENABLED: ${PLC_PHYSICAL_ENABLED:-false}
      PLC_READ_ONLY_ENABLED: ${PLC_READ_ONLY_ENABLED:-false}
      PLC_WRITE_ENABLED: ${PLC_WRITE_ENABLED:-false}
      PLC_ISPSOFT_COMPILED: ${PLC_ISPSOFT_COMPILED:-false}
      PLC_REGISTER_OFFSET_VALIDATED: ${PLC_REGISTER_OFFSET_VALIDATED:-false}
      PLC_ASCII_BYTE_ORDER_VALIDATED: ${PLC_ASCII_BYTE_ORDER_VALIDATED:-false}
      PLC_NETWORK_VALIDATED: ${PLC_NETWORK_VALIDATED:-false}
      PLC_READER_ETHERNETIP_VALIDATED: ${PLC_READER_ETHERNETIP_VALIDATED:-false}
      PLC_PHYSICAL_E2E_AUTHORIZED: ${PLC_PHYSICAL_E2E_AUTHORIZED:-false}
      PLC_MODBUS_HOST: ${PLC_MODBUS_HOST:-192.168.29.5}
      PLC_MODBUS_PORT: ${PLC_MODBUS_PORT:-502}
      PLC_MODBUS_UNIT_ID: ${PLC_MODBUS_UNIT_ID:-1}
      PLC_PC_IP: ${PLC_PC_IP:-192.168.29.10}
      PLC_NETMASK: ${PLC_NETMASK:-255.255.255.0}
      PLC_MODBUS_ADDRESS_BASE: ${PLC_MODBUS_ADDRESS_BASE:-0}
      PLC_ASCII_BYTE_ORDER: ${PLC_ASCII_BYTE_ORDER:-HIGH_LOW}
      PLC_EXTERNAL_SIMULATOR_ENABLED: ${PLC_EXTERNAL_SIMULATOR_ENABLED:-false}
      PLC_EXTERNAL_SIMULATOR_WRITE_ENABLED: ${PLC_EXTERNAL_SIMULATOR_WRITE_ENABLED:-false}
      PLC_EXTERNAL_SIMULATOR_HOST: ${PLC_EXTERNAL_SIMULATOR_HOST:-host.docker.internal}
      PLC_EXTERNAL_SIMULATOR_PORT: ${PLC_EXTERNAL_SIMULATOR_PORT:-1502}
      PLC_EXTERNAL_SIMULATOR_UNIT_ID: ${PLC_EXTERNAL_SIMULATOR_UNIT_ID:-1}
      PLC_EXTERNAL_SIMULATOR_LOGICAL_ORIGIN: ${PLC_EXTERNAL_SIMULATOR_LOGICAL_ORIGIN:-700}
      PLC_EXTERNAL_SIMULATOR_REGISTER_BASE: ${PLC_EXTERNAL_SIMULATOR_REGISTER_BASE:-0}
      PLC_EXTERNAL_SIMULATOR_TIMEOUT_MS: ${PLC_EXTERNAL_SIMULATOR_TIMEOUT_MS:-1000}
      BARCODE_DELIMITER: ${BARCODE_DELIMITER:-;}
      BARCODE_FIELD_ORDER: ${BARCODE_FIELD_ORDER:-model,ean,serial,production_order,url}
      BARCODE_URL_REQUIRED: ${BARCODE_URL_REQUIRED:-true}
      RETEST_ENABLED: ${RETEST_ENABLED:-false}
      RETEST_SIMULATOR_ENABLED: ${RETEST_SIMULATOR_ENABLED:-true}
      RETEST_MAX_ATTEMPTS: ${RETEST_MAX_ATTEMPTS:-2}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: autopackline_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_TIME_ZONE: ${VITE_TIME_ZONE:-America/Manaus}
      AUTOPACKLINE_HTTPS: ${AUTOPACKLINE_HTTPS:-false}
    ports:
      - "5173:5173"
    depends_on:
      - backend

  frontend_secure:
    build: ./frontend
    container_name: autopackline_frontend_secure
    restart: unless-stopped
    environment:
      VITE_API_URL: ""
      VITE_TIME_ZONE: ${VITE_TIME_ZONE:-America/Manaus}
      AUTOPACKLINE_HTTPS: "true"
    ports:
      - "5174:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
